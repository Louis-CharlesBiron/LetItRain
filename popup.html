<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="img/favicon.png" type="image/x-icon">
    <title>Rain config</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="main">
        <div class="header">
            <div class="settingsParent">
                <div class="settingsContent">
                    <div class="settingsList">
                        <label>Toggle Rain Shortcut: <input type="text" readonly id="rainShortcutInput" title="Open shortcut page..."></label>
                        <label>Rainbow rain: <label class="checkboxParentSmall"><input id="rainbowCheckbox" type="checkbox"><span class="checkCoreSmall"></span></label></label>
                        <label>Rain Easing: <select id="easingSelect"></select></label>
                        <label>Stop if FPS below: <input type="number" min="0" max="60" step="1" id="fpsSafeLimitInput" placeholder="20"></label>
                        <div class="settingsSection">
                            <span>Presets</span>
                            <div>
                                <div>
                                    <button id="presetLight">Light Rain</button>
                                    <button id="presetMild">Mild Rain</button>
                                    <button id="presetHeavy">Heavy Rain</button>
                                </div>
                                <div>
                                    <button id="presetReset">Reset</button>
                                    <button id="presetRandom">Random</button>
                                    <button id="presetCustom">Custom</button>
                                </div>
                                <button id="saveCustomPresetButton">Save Custom Preset</button>
                            </div>
                        </div>
                    </div>
                </div>
                <button id="settingsButton">Settings</button>
            </div>

            <div class="left">
                <div class="title">
                    <span>Let</span>
                    <span style="margin-left: 1px;">It</span>
                    <span>Rain</span>
                </div>
                <span id="version">v1.0</span>
            </div>

            <div class="right">
                <div class="controlsParent">
                    <span>Rain: </span>
                    <span class="overlayCheckParent"><label class="checkboxParent"><input id="overlayCheckbox" type="checkbox"><span class="checkCore"><div><span>Rain</span><span id="overlayStatusText">Off</span></div></span></label></span>
                </div>
            </div>

            <span id="statusDisplay"></span>
        </div>

        <div class="content">
    
            <div class="inputsParent">
                <label>
                    <div title="Defines the delay between each wave of rain"><span>Rate</span><span>:</span></div>
                    <div>
                        <input type="number" id="rateInput" min="10" max="600" step="5" placeholder="45">
                        <input type="range"  id="rateRange" min="10" max="600" step="5">
                    </div>
                    </label>
                <label>
                    <div title="Defines the amount of raindrops per wave of rain"><span>Amount</span><span>:</span></div>
                    <div>
                        <input type="number" id="amountInput" min="1" max="50" step="1" placeholder="5">
                        <input type="range"  id="amountRange" min="1" max="50" step="1">
                    </div>
                </label>
                <label>
                    <div title="Defines the base width of a raindrop"><span>Width</span> <span>:</span></div>
                    <div>
                        <input type="number" id="widthInput" min="0.1" max="10" step="0.1" placeholder="0.75">
                        <input type="range"  id="widthRange" min="0.1" max="10" step="0.1">
                    </div>
                </label>
                <label>
                    <div title="Defines the base height of a raindrop"><span>Height</span><span>:</span></div>
                    <div>
                        <input type="number" id="heightInput" min="0.1" max="100" step="1" placeholder="10">
                        <input type="range"  id="heightRange" min="0.1" max="100" step="1">
                    </div>
                </label>
                <label>
                    <div title="Defines the base time it takes for a raindrop to traverse the screen"><span>Fall Time</span><span>:</span></div>
                    <div>
                        <input type="number" id="fallTimeInput" min="100" max="10000" step="100" placeholder="1200">
                        <input type="range"  id="fallTimeRange" min="100" max="10000" step="100">
                    </div>
                </label>
                <label for="alphaRange">
                    <div title="Defines the color and opacity of the rain drops"><span>Color</span> <span>:</span></div>
                    <div>
                        <input type="color" id="colorInput">
                        <input type="range" min="5" max="100" step="1" id="alphaRange">
                    </div>
                </label>
                <label>
                    <div title="Defines the size of the clarity radius around the mouse"><span>Clear Zone</span><span>:</span></div>
                    <div>
                        <input type="number" id="limitInput" min="50" max="1000" step="10" placeholder="300">
                        <input type="range"  id="limitRange" min="50" max="1000" step="10">
                    </div>
                </label>

            </div>

            <span class="credits" title="- Idea by Noémie Laplante
            - Execution by Louis-Charles Biron">Credits</span>
        </div>
    </div>
    
    <script src="overlay/canvasDotEffect.js"></script>
    <script src="constants.js"></script>
    <script src="utils.js"></script>
    <script src="StorageManager.js"></script>
    <script async src="popup.js"></script>
</body>
</html>
